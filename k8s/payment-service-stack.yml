apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-api-secrets
  namespace: fgc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: payment-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: connection-string
      remoteRef:
        key: /fgc/payment/connection-string
    - secretKey: jwt-key
      remoteRef:
        key: /fgc/jwt/secret
    - secretKey: rabbitmq-uri
      remoteRef:
        key: /fgc/payment/rabbitmq-uri
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /fgc/aws/access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /fgc/aws/secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-api-config
  namespace: fgc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: payment-api-config
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        jwt-issuer: "{{ .jwt_issuer }}"
        jwt-audience: "{{ .jwt_audience }}"
        jwt-token-ttl: "{{ .jwt_token_ttl }}"
        order-created-exchange: "{{ .order_created_exchange }}"
        order-created-routing-key: "{{ .order_created_routing_key }}"
        payment-processed-exchange: "{{ .payment_processed_exchange }}"
        payment-processed-routing-key: "{{ .payment_processed_routing_key }}"
        aws-sqs-payment-processed-queue-url: "{{ .sqs_payment_processed_url }}"
        AWS_REGION: "{{ .aws_region }}"
  data:
    - secretKey: jwt_issuer
      remoteRef:
        key: /fgc/jwt/issuer
    - secretKey: jwt_audience
      remoteRef:
        key: /fgc/jwt/audience
    - secretKey: jwt_token_ttl
      remoteRef:
        key: /fgc/jwt/token-ttl
    - secretKey: order_created_exchange
      remoteRef:
        key: /fgc/payment/order-created-exchange
    - secretKey: order_created_routing_key
      remoteRef:
        key: /fgc/payment/order-created-routing-key
    - secretKey: payment_processed_exchange
      remoteRef:
        key: /fgc/payment/payment-processed-exchange
    - secretKey: payment_processed_routing_key
      remoteRef:
        key: /fgc/payment/payment-processed-routing-key
    - secretKey: sqs_payment_processed_url
      remoteRef:
        key: /fgc/sqs/payment-processed-queue-url
    - secretKey: aws_region
      remoteRef:
        key: /fgc/aws/region
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-api, namespace: fgc }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-api } }
  template:
    metadata:
      labels: { app: payment-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: payment-api
          image: 230287251097.dkr.ecr.sa-east-1.amazonaws.com/fgc-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: payment-api-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: payment-api-secrets, key: AWS_SECRET_ACCESS_KEY } }
            - name: AWS_REGION
              valueFrom: { secretKeyRef: { name: payment-api-config, key: AWS_REGION } }
            - name: ConnectionStrings__Default
              valueFrom: { secretKeyRef: { name: payment-api-secrets, key: connection-string } }
            - name: Jwt__Issuer
              valueFrom: { secretKeyRef: { name: payment-api-config, key: jwt-issuer } }
            - name: Jwt__Audience
              valueFrom: { secretKeyRef: { name: payment-api-config, key: jwt-audience } }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: payment-api-secrets, key: jwt-key } }
            - name: Jwt__TokenTtlInMinutes
              valueFrom: { secretKeyRef: { name: payment-api-config, key: jwt-token-ttl } }
            - name: RabbitMQ__URI
              valueFrom: { secretKeyRef: { name: payment-api-secrets, key: rabbitmq-uri } }
            - name: RabbitMQ__OrderCreatedEvent__Exchange
              valueFrom: { secretKeyRef: { name: payment-api-config, key: order-created-exchange } }
            - name: RabbitMQ__OrderCreatedEvent__RoutingKey
              valueFrom: { secretKeyRef: { name: payment-api-config, key: order-created-routing-key } }
            - name: RabbitMQ__PaymentProcessedEvent__Exchange
              valueFrom: { secretKeyRef: { name: payment-api-config, key: payment-processed-exchange } }
            - name: RabbitMQ__PaymentProcessedEvent__RoutingKey
              valueFrom: { secretKeyRef: { name: payment-api-config, key: payment-processed-routing-key } }
            - name: AwsSQS__PaymentProcessedQueueUrl
              valueFrom: { secretKeyRef: { name: payment-api-config, key: aws-sqs-payment-processed-queue-url } }
---
apiVersion: v1
kind: Service
metadata: { name: payment-api-service, namespace: fgc }
spec:
  type: ClusterIP
  selector: { app: payment-api }
  ports: [{ port: 80, targetPort: 8080 }]
